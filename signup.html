<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign Up - Digital Khata</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F4F7F6" id="meta-theme-color">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page-body">

  <div class="app-viewport">
    <div class="app-container auth-container">
      
      <!-- Background Shapes -->
      <div class="pastel-shape shape-top-right"></div>
      <div class="pastel-shape shape-bottom-left"></div>

      <div class="auth-card-wrapper">
        <!-- Header -->
        <div class="auth-header text-center">
          <div class="welcome-logo-wrapper mb-2">
            <img src="digital-khata-logo.svg" alt="Digital Khata Logo" class="welcome-logo">
          </div>
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Join Digital Khata to manage your business cloud ledger</p>
        </div>

        <!-- Alert Error Banner -->
        <div id="auth-error-alert" class="alert-banner alert-danger hidden">
          <span id="auth-error-message">Error creating account.</span>
        </div>

        <!-- Signup Form -->
        <form id="form-signup" class="app-form">
          <div class="form-group">
            <label for="input-signup-name">Full Name *</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="input-signup-name" placeholder="Enter your full name" required>
            </div>
          </div>

          <div class="form-group">
            <label for="input-signup-phone">Phone Number * (Unique)</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
              </svg>
              <input type="tel" id="input-signup-phone" placeholder="03XX-XXXXXXX" required>
            </div>
          </div>

          <div class="form-group">
            <label for="input-signup-biz">Business / Shop Name</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              <input type="text" id="input-signup-biz" placeholder="e.g. Bismillah General Store">
            </div>
          </div>

          <div class="form-group">
            <label for="input-signup-email">Email Address (Optional)</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input type="email" id="input-signup-email" placeholder="owner@example.com">
            </div>
          </div>

          <div class="form-group">
            <label for="input-signup-password">Password * (Min 8 characters)</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input type="password" id="input-signup-password" minlength="8" placeholder="Create strong password" required>
            </div>
          </div>

          <button type="submit" id="btn-signup-submit" class="btn btn-primary btn-block btn-lg mt-4">
            <span>Create Account</span>
          </button>
        </form>

        <!-- Footer Link -->
        <div class="auth-footer text-center mt-4">
          <p class="text-muted" style="font-size: 13.5px;">
            Already have an account? <a href="login.html" class="auth-link-bold">Log In</a>
          </p>
        </div>

      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/database.js"></script>
  <script src="js/migration.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Auth && window.Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }

      const formSignup = document.getElementById('form-signup');
      const errorAlert = document.getElementById('auth-error-alert');
      const errorMsg = document.getElementById('auth-error-message');
      const submitBtn = document.getElementById('btn-signup-submit');

      formSignup.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.classList.add('hidden');

        const fullName = document.getElementById('input-signup-name').value;
        const phone = document.getElementById('input-signup-phone').value;
        const businessName = document.getElementById('input-signup-biz').value;
        const email = document.getElementById('input-signup-email').value;
        const password = document.getElementById('input-signup-password').value;

        submitBtn.disabled = true;
        submitBtn.querySelector('span').textContent = 'Creating Account...';

        try {
          await window.Auth.signup({ fullName, phone, email, password, businessName });
          window.location.href = 'index.html';
        } catch (err) {
          errorMsg.textContent = err.message || 'Signup failed. Please try again.';
          errorAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
